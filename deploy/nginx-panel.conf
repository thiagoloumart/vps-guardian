# Faxina · Visão Técnica — painel. Acesso SÓ pela malha Tailscale.
# DNS (guardian.example.com) aponta p/ o IP Tailscale 100.x.y.z (não-roteável fora da malha)
# e este server só aceita origem na faixa Tailscale CGNAT — dupla barreira.
server {
    listen 80;
    server_name guardian.example.com;

    allow 100.64.0.0/10;   # Tailscale (CGNAT)
    allow 127.0.0.1;       # local (testes)
    deny all;

    access_log /var/log/nginx/faxina.access.log;
    error_log  /var/log/nginx/faxina.error.log;

    location / {
        proxy_pass http://127.0.0.1:9777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 140s;   # scan completo (profundo) pode levar alguns segundos
    }
}
